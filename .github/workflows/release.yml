name: Release

# Builds the installers:
#   Windows: VloomDAW-<version>-windows-x64-setup.exe   (Inno Setup)
#   macOS:   VloomDAW-<version>-macos-universal.dmg     (Apple silicon + Intel)
#   Linux:   VloomDAW-<version>-linux-x86_64.AppImage
#
# - A tag v* (e.g. v0.2.0) builds them and opens a DRAFT GitHub Release with
#   them and SHA256SUMS.txt. The "sign" job then waits for a maintainer to
#   approve it (the release-signing environment), signs SHA256SUMS.txt with
#   the update key and uploads SHA256SUMS.txt.minisig; a maintainer then
#   reviews and publishes the draft. See docs/releasing.md.
# - "Run workflow" (Actions tab) or a PR that changes packaging builds them
#   as workflow artifacts only (kept 14 days).
#
# Not signed yet: Windows SmartScreen warns, and macOS needs right-click >
# Open the first time (the app is ad-hoc signed so it runs on Apple silicon).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022 # has Inno Setup 6
          - name: macos
            os: macos-15
          - name: linux
            os: ubuntu-22.04 # an older glibc: the AppImage runs on more distributions
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout VloomDAW
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: VloomDAW
          persist-credentials: false

      - name: Read the pinned vloom-engine revision
        id: engine
        run: |
          sha=$(sed -nE 's/^set\(VLOOM_ENGINE_GIT_TAG "([0-9a-f]{40})".*/\1/p' VloomDAW/cmake/Dependencies.cmake)
          test -n "$sha" || { echo "::error::no 40-character VLOOM_ENGINE_GIT_TAG in cmake/Dependencies.cmake"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout vloom-engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vloom-audio/vloom-engine
          ref: ${{ steps.engine.outputs.sha }}
          path: vloom-engine
          persist-credentials: false

      - name: Version
        id: version
        run: |
          # A tag gives the version (v0.2.0 -> 0.2.0); otherwise the project's
          # version plus the commit. Checked: it goes into file names.
          base=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' VloomDAW/CMakeLists.txt | head -n1)
          test -n "$base" || { echo "::error::no VERSION x.y.z in CMakeLists.txt"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            # The app reports the CMake VERSION: a tag that says otherwise would
            # ship an installer named for one version holding another.
            # (v0.2.0 and v0.2.0-rc1 both need VERSION 0.2.0.)
            if [[ "${version%%-*}" != "$base" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION $base in CMakeLists.txt"
              exit 1
            fi
          else
            version="${base}-dev.${GITHUB_SHA::7}"
          fi
          # The same rule as CMake's VLOOMDAW_VERSION_LABEL and sign-release.sh:
          # x.y.z with an optional pre-release, no build metadata (+...).
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::unusable version '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Numbers only, for the Windows file version resource.
          echo "numeric=$(grep -oE '^[0-9]+([.][0-9]+){0,3}' <<< "$version")" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.3' # the same as CI (see ci.yml)
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libasound2-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libfontconfig1 libdbus-1-3

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf

      # macOS and Linux: a small static FFmpeg built from its pinned source
      # (scripts/build-ffmpeg.sh), universal on macOS like the app. Windows
      # downloads a pinned prebuilt one at configure time (cmake/FFmpeg.cmake).
      - name: Cache FFmpeg
        if: runner.os != 'Windows'
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-prefix
          key: ffmpeg-release-${{ runner.os }}-${{ hashFiles('VloomDAW/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mode=native
          [[ "$RUNNER_OS" == macOS ]] && mode=universal
          bash VloomDAW/scripts/build-ffmpeg.sh ffmpeg-prefix "$mode"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-release-${{ runner.os }}-${{ hashFiles('VloomDAW/cmake/Dependencies.cmake', 'vloom-engine/cmake/Dependencies.cmake') }}

      - name: Configure
        working-directory: VloomDAW
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            # One app for Apple silicon and Intel; Qt 6.10 needs macOS 13.
            extra+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          elif [[ "$RUNNER_OS" == Linux ]]; then
            extra+=(-DCMAKE_INSTALL_PREFIX=/usr)
          fi
          if [[ "$RUNNER_OS" != Windows ]]; then
            extra+=(-DFFMPEG_ROOT="$GITHUB_WORKSPACE/ffmpeg-prefix")
          fi
          # The full version (0.1.0-rc.1) is what the app reports; see src/CMakeLists.txt.
          cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DVLOOMDAW_VERSION_LABEL="$VERSION" "${extra[@]}"

      - name: Build
        working-directory: VloomDAW
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
        run: cmake --build --preset release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.version.outputs.numeric }}
        run: |
          cmake -S vloom-engine/tools/vloom-plugin-bridge -B bridge32 -A Win32
          cmake --build bridge32 --config Release
          cmake --install VloomDAW/build/release --config Release --prefix stage
          cp bridge32/Release/vloom-plugin-bridge32.exe stage/bin/
          windeployqt --release --no-translations --no-compiler-runtime stage/bin/VloomDAW.exe
          # The MSVC runtime goes next to the app (app-local), so it runs on a
          # PC without the VC++ Redistributable. windeployqt cannot find it
          # outside a developer prompt: take it from Visual Studio directly.
          vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          crt=$(ls -d "$(cygpath -u "$vs")"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -n1)
          test -d "$crt" || { echo "::error::MSVC runtime not found"; exit 1; }
          cp "$crt"/*.dll stage/bin/
          ls stage/bin/*.dll
          iscc="$(command -v iscc || true)"
          [[ -n "$iscc" ]] || iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          mkdir -p dist
          # Inno Setup options take "-" as well as "/"; "-" keeps Git Bash from
          # turning "/D..." into a path.
          "$iscc" "-DAppVersion=$VERSION" "-DNumericVersion=$NUMERIC_VERSION" "-DStageDir=$(cygpath -w "$PWD/stage/bin")" \
            "-DOutputDir=$(cygpath -w "$PWD/dist")" "$(cygpath -w "$PWD/VloomDAW/packaging/windows/VloomDAW.iss")"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake --install VloomDAW/build/release --prefix stage
          macdeployqt stage/VloomDAW.app -always-overwrite
          # Ad-hoc signature: unsigned code does not run on Apple silicon, and
          # macdeployqt changed the binaries after the linker signed them.
          codesign --force --deep --sign - stage/VloomDAW.app
          codesign --verify --deep --strict stage/VloomDAW.app
          mkdir -p dmg dist
          cp -R stage/VloomDAW.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "VloomDAW $VERSION" -srcfolder dmg -ov -format UDZO \
            "dist/VloomDAW-$VERSION-macos-universal.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The tools are AppImages themselves; this runs them without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          DESTDIR="$PWD/AppDir" cmake --install VloomDAW/build/release
          # Pinned releases, checked against their SHA-256 before they run.
          mkdir -p tools dist
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  tools/linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  tools/linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x tools/*.AppImage
          export PATH="$PWD/tools:$PATH" QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LDAI_OUTPUT="dist/VloomDAW-$VERSION-linux-x86_64.AppImage" OUTPUT="$LDAI_OUTPUT"
          linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/VloomDAW --executable AppDir/usr/bin/vloomdaw-plugin-probe \
            --desktop-file VloomDAW/packaging/linux/vloomdaw.desktop \
            --icon-file VloomDAW/resources/app/vloomdaw.png \
            --plugin qt --output appimage
          test -f "$LDAI_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VloomDAW-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the draft release
    steps:
      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: VloomDAW-*
          merge-multiple: true
          path: dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "VloomDAW ${GITHUB_REF_NAME}" --generate-notes ./*

  sign:
    name: sign the release
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    # Runs only after a maintainer approves it: the release-signing
    # environment requires a reviewer and holds the minisign secret key
    # (MINISIGN_SECRET_KEY) and its password (MINISIGN_PASSWORD), so no other
    # job, branch or pull request can reach them.
    environment: release-signing
    permissions:
      contents: write # uploads the signature to the draft release
    steps:
      - name: Check out the public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/update/minisign.pub
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Sign SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/sign"
          mkdir -p "$work/dist"
          trap 'rm -rf "$work"' EXIT
          # Sign only a release tag (the same rule as scripts/sign-release.sh):
          # the trigger is just v*, and "vfoo" must not get the update key.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag (v<major>.<minor>.<patch>[-<pre-release>])"
            exit 1
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::MINISIGN_SECRET_KEY and MINISIGN_PASSWORD must be set in the release-signing environment"
            exit 1
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$work/dist" \
            --pattern SHA256SUMS.txt --pattern 'VloomDAW-*'
          # Vouch only for what was checked: every listed file must be here and match.
          (cd "$work/dist" && sha256sum --check --strict SHA256SUMS.txt)
          # Secrets set from Windows may carry CRLF line ends: minisign wants LF.
          printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' > "$work/vloomdaw.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | tr -d '\r' |
            minisign -S -s "$work/vloomdaw.key" -m "$work/dist/SHA256SUMS.txt" \
              -t "VloomDAW $GITHUB_REF_NAME SHA256SUMS.txt"
          rm -f "$work/vloomdaw.key"
          # The signature must verify with the key built into the app.
          minisign -V -p packaging/update/minisign.pub -m "$work/dist/SHA256SUMS.txt"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "$work/dist/SHA256SUMS.txt.minisig"
          echo "Signed: $GITHUB_REF_NAME now carries SHA256SUMS.txt.minisig. Publish the draft when ready."
